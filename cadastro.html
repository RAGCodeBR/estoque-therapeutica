<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Therapeutica - Cadastro</title>
    <link rel="stylesheet" href="./assets/css/cadastro.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="div-card">
        <a class="botao-voltar-login" href="./login.html" aria-label="Voltar para a página de login">
            <span aria-hidden="true">←</span> Voltar ao login
        </a>
        <img src="./assets/img/therapeutica-logo-01.png">

        <hr>

        <form class="div-cadastro" id="formulario-cadastro">
            <input type="text" id="usuario" placeholder="Nome de usuário" required>

            <input type="email" id="email" placeholder="E-mail" required>
            <div class="campo-senha">
                <input type="password" id="senha" placeholder="Senha" required>
                <button type="button" class="botao-olho fa fa-eye" id="verSenha" aria-label="Mostrar senha"></button>
            </div>
            <div class="campo-senha">
                <input type="password" id="confirmarSenha" placeholder="Confirme a senha" required>
                <button type="button" class="botao-olho fa fa-eye" id="verConfirmSenha" aria-label="Mostrar confirmação de senha"></button>
            </div>
            <select id="filial" required aria-label="Filial">
                <option value="" selected disabled>Selecione sua filial</option>
                <option value="matriz">Matriz</option><option value="blumenau">Blumenau</option>
                <option value="lucas">Lucas do Rio Verde</option><option value="sinop">Sinop</option>
            </select>

            <button type="submit" class="botao-cadastrar" id="botao-cadastrar">Cadastrar</button>
            <p class="mensagem-autenticacao" id="mensagem-cadastro" role="status" aria-live="polite"></p>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'"></script>
    <script src="./assets/js/env.js"></script>
    <script src="./assets/js/supabase-client.js"></script>
    <script src="./assets/js/cadastro.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e87861">
    <title>Definir nova senha - Estoque Therapeutica</title>
    <link rel="stylesheet" href="./assets/css/login.css">
</head>
<body>
    <main class="card-login">
        <a class="botao-voltar-login" href="./login.html" aria-label="Voltar para a página de login">
            <span aria-hidden="true">←</span> Voltar ao login
        </a>
        <img class="logo" src="./assets/img/therapeutica-logo-01.png" alt="Therapeutica">
        <div class="cabecalho-formulario">
            <h1>Nova senha</h1>
            <span>Escolha uma senha nova para acessar sua conta.</span>
        </div>
        <form class="formulario-autenticacao" id="formulario-nova-senha">
            <label class="sr-only" for="nova-senha">Nova senha</label>
            <input type="password" id="nova-senha" placeholder="Nova senha" required minlength="6" autocomplete="new-password">
            <label class="sr-only" for="confirmar-senha">Confirmar nova senha</label>
            <input type="password" id="confirmar-senha" placeholder="Confirmar nova senha" required minlength="6" autocomplete="new-password">
            <button type="submit" class="botao-logar">Salvar nova senha</button>
        </form>
        <p class="mensagem-autenticacao" id="mensagem-nova-senha" role="status" aria-live="polite"></p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'"></script>
    <script src="./assets/js/env.js"></script>
    <script src="./assets/js/supabase-client.js"></script>
    <script src="./assets/js/redefinir-senha.js"></script>
</body>
</html>
